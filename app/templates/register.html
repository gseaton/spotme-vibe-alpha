{% extends "base.html" %}

{% block title %}Register - SpotMe{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h1>SpotMe</h1>
        <h2>Register</h2>

        <div id="error-message" class="error-message"></div>
        <div id="success-message" class="success-message"></div>

        <form id="register-form">
            <div class="form-group">
                <label for="tenant_id">Tenant ID</label>
                <input type="text" id="tenant_id" name="tenant_id" required placeholder="Enter your tenant ID">
            </div>

            <div class="form-group">
                <label for="full_name">Full Name</label>
                <input type="text" id="full_name" name="full_name" required placeholder="Enter your full name">
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required placeholder="Enter your email">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Enter your password">
            </div>

            <button type="submit" class="btn btn-primary">Register</button>
        </form>

        <div class="auth-footer">
            <p>Already have an account? <a href="/">Login here</a></p>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('register-form').addEventListener('submit', async (e) => {
    e.preventDefault();

    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const fullName = document.getElementById('full_name').value;
    const tenantId = document.getElementById('tenant_id').value;
    const errorDiv = document.getElementById('error-message');
    const successDiv = document.getElementById('success-message');
    const submitBtn = e.target.querySelector('button[type="submit"]');

    // Clear previous messages
    errorDiv.textContent = '';
    successDiv.textContent = '';

    // Add loading state
    submitBtn.classList.add('btn-loading');
    submitBtn.disabled = true;

    try {
        const response = await fetch('/api/auth/register', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                email: email,
                password: password,
                full_name: fullName,
                tenant_id: tenantId
            })
        });

        if (response.ok) {
            successDiv.textContent = 'Registration successful! Redirecting to login...';
            submitBtn.textContent = 'Success!';
            submitBtn.classList.remove('btn-loading');

            setTimeout(() => {
                window.location.href = '/';
            }, 2000);
        } else {
            const error = await response.json();
            errorDiv.textContent = error.detail || 'Registration failed. Please check your information.';

            // Remove loading state
            submitBtn.classList.remove('btn-loading');
            submitBtn.disabled = false;
        }
    } catch (error) {
        errorDiv.textContent = 'An error occurred. Please check your connection and try again.';
        console.error('Error:', error);

        // Remove loading state
        submitBtn.classList.remove('btn-loading');
        submitBtn.disabled = false;
    }
});
</script>
{% endblock %}
